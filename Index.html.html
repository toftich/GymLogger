<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e131d"><title>GymLogg</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f7fb;background:#0e131d}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:20px 15px 95px}h1{margin:0;font-size:29px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:16px 0 6px}p,.muted,small{color:#a9b6c9}.muted,small{font-size:13px}.panel{background:#1b2533;border:1px solid #334253;border-radius:16px;padding:16px;margin-top:16px}label{display:block;color:#c0ccda;font-size:13px;margin:11px 0 5px}input,select,textarea,button{font:inherit;border-radius:10px;padding:11px;width:100%;min-width:0}input,select,textarea{background:#101824;border:1px solid #4b5b6e;color:white}button{border:0;background:#73e4af;color:#102319;font-weight:750;cursor:pointer;margin-top:10px}button.secondary{background:#34445a;color:white}button.danger{background:#55323d;color:#ffd6df}button:disabled{opacity:.45;cursor:default}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row button{width:auto;flex-shrink:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.entry{padding:12px 0;border-bottom:1px solid #354255}.entry:last-child{border:0}.hidden{display:none!important}nav{position:sticky;top:0;background:#0e131df0;display:flex;gap:6px;padding:12px 0;z-index:2}nav button{background:#2a394b;color:white;font-size:13px;padding:10px 5px;margin:0}nav button.active{background:#73e4af;color:#102319}.pill{font-size:12px;background:#304052;border-radius:99px;padding:5px 8px;color:#d4e3f0}.exercise{border:1px solid #3b4b5e;border-radius:12px;padding:12px;margin:10px 0}.setrow{display:grid;grid-template-columns:36px 1fr 1fr 1fr;gap:7px;align-items:end;margin-top:9px}.setrow label{margin:0}.setrow input{padding:9px 5px;text-align:center}.hint{font-size:12px;color:#a9b6c9;margin-top:5px}.empty{padding:12px 0;color:#a9b6c9}.smallbutton{padding:8px 10px;font-size:13px} .success{color:#73e4af} .warning{color:#ffd38c}
</style></head><body><main><header><h1>🏋️ GymLogg</h1><p style="margin:5px 0 0">Dina program. Dina framsteg.</p></header><nav><button class="active" data-tab="program">Program</button><button data-tab="train">Träna</button><button data-tab="history">Historik</button><button data-tab="settings">Backup</button></nav>
<section id="programView"><div class="panel"><h2>Mina program</h2><div id="programList"></div><button id="newProgram">+ Skapa eget program</button></div><div class="panel hidden" id="editor"><h2 id="editorTitle">Nytt program</h2><label>Programmets namn</label><input id="programName" maxlength="60" placeholder="T.ex. Push A"><h3>Övningar</h3><div id="editExercises"></div><button class="secondary" id="addExercise">+ Lägg till övning</button><button id="saveProgram">Spara program</button><button class="secondary" id="cancelEdit">Avbryt</button></div></section>
<section id="trainView" class="hidden"><div class="panel"><h2>Träningspass</h2><div id="trainContent"></div></div></section>
<section id="historyView" class="hidden"><div class="panel"><h2>Avslutade pass</h2><div id="historyContent"></div></div></section>
<section id="settingsView" class="hidden"><div class="panel"><h2>Säkerhetskopiering</h2><p>All data lagras bara i denna webbläsare. Exportera regelbundet en backup, särskilt innan du byter telefon.</p><button id="export">Exportera backup (.json)</button><label for="import">Återställ backup (.json)</label><input type="file" id="import" accept=".json,application/json"><button class="danger" id="wipe">Radera all GymLogg-data</button></div></section><p class="muted">GymLogg 2.0 · Lokal lagring · Ingen inloggning</p></main>
<script>
'use strict';const KEY='gymlogg-v2',OLD='gymlogg-v1',$=id=>document.getElementById(id),uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=t=>new Date(t).toLocaleString('sv-SE',{dateStyle:'medium',timeStyle:'short'});let data={programs:[],sessions:[],active:null,legacy:[]},editId=null,working=[];try{let raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&Array.isArray(raw.programs)&&Array.isArray(raw.sessions))data={...data,...raw};else{let old=JSON.parse(localStorage.getItem(OLD)||'[]');if(Array.isArray(old))data.legacy=old}}catch{}function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{alert('Det gick inte att spara. Kontrollera lagringsutrymmet.');return false}}function tab(name){for(const n of ['program','train','history','settings']){$(n+'View').classList.toggle('hidden',n!==name);document.querySelector(`[data-tab="${n}"]`).classList.toggle('active',n===name)}if(name==='program')renderPrograms();if(name==='train')renderTrain();if(name==='history')renderHistory()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));function renderPrograms(){const box=$('programList');box.innerHTML=data.programs.length?data.programs.map(p=>`<div class="entry"><div class="row"><div><strong>${esc(p.name)}</strong><div class="muted">${p.exercises.length} övningar</div></div><button class="secondary smallbutton" data-edit="${esc(p.id)}">Ändra</button></div><button data-start="${esc(p.id)}">Starta pass</button></div>`).join(''):'<div class="empty">Inga program ännu. Skapa ditt första nedan.</div>'}function exRow(e,i){return `<div class="exercise" data-eidx="${i}"><div class="row"><strong>Övning ${i+1}</strong><button class="danger smallbutton" data-remove="${i}">Ta bort</button></div><label>Namn</label><input data-field="name" maxlength="80" placeholder="T.ex. Bänkpress" value="${esc(e.name)}"><div class="grid"><div><label>Set</label><input data-field="sets" type="number" min="1" max="15" value="${esc(e.sets)}"></div><div><label>Repsmål</label><input data-field="reps" maxlength="24" placeholder="8–10" value="${esc(e.reps)}"></div><div><label>RIR-mål</label><input data-field="rir" maxlength="12" placeholder="1–2" value="${esc(e.rir)}"></div></div></div>`}function renderEditor(){$('editExercises').innerHTML=working.map(exRow).join('')}function beginEdit(p){editId=p?.id||null;working=p?structuredClone(p.exercises):[{name:'',sets:3,reps:'8–10',rir:'2'}];$('programName').value=p?.name||'';$('editorTitle').textContent=p?'Redigera program':'Nytt program';$('editor').classList.remove('hidden');renderEditor();$('editor').scrollIntoView({behavior:'smooth',block:'start'})}function syncEditor(){document.querySelectorAll('[data-eidx]').forEach(row=>{const e=working[+row.dataset.eidx];row.querySelectorAll('[data-field]').forEach(inp=>e[inp.dataset.field]=inp.dataset.field==='sets'?Number(inp.value):inp.value)})}$('newProgram').onclick=()=>beginEdit();$('addExercise').onclick=()=>{syncEditor();working.push({name:'',sets:3,reps:'8–10',rir:'2'});renderEditor()};$('editExercises').onclick=e=>{const i=e.target.dataset.remove;if(i!==undefined){syncEditor();working.splice(+i,1);renderEditor()}};$('cancelEdit').onclick=()=>$('editor').classList.add('hidden');$('saveProgram').onclick=()=>{syncEditor();const name=$('programName').value.trim();if(!name||!working.length||working.some(e=>!e.name.trim()||!Number.isInteger(e.sets)||e.sets<1||e.sets>15)){alert('Ange ett namn och minst en övning med 1–15 set.');return}const p={id:editId||uid(),name,exercises:working.map(e=>({...e,name:e.name.trim()}))};if(editId)data.programs=data.programs.map(x=>x.id===editId?p:x);else data.programs.push(p);if(persist()){$('editor').classList.add('hidden');renderPrograms()}};
function latest(name){for(const s of [...data.sessions].reverse()){const e=s.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());if(e)return e}return null}function start(id){if(data.active&&!confirm('Ett pass pågår. Vill du ersätta det?'))return;const p=data.programs.find(x=>x.id===id);if(!p)return;data.active={id:uid(),programId:p.id,name:p.name,time:Date.now(),exercises:p.exercises.map(e=>({...e,actual:Array.from({length:e.sets},()=>({kg:'',reps:'',rir:''}))}))};persist();tab('train')}function renderTrain(){const a=data.active,el=$('trainContent');if(!a){el.innerHTML='<div class="empty">Inget pågående pass. Gå till Program och välj Starta pass.</div><button class="secondary" id="goPrograms">Välj program</button>';$('goPrograms').onclick=()=>tab('program');return}el.innerHTML=`<div class="row"><strong>${esc(a.name)}</strong><span class="pill">${fmt(a.time)}</span></div>${a.exercises.map((e,i)=>{const prev=latest(e.name);return `<div class="exercise"><h3>${esc(e.name)}</h3><div class="muted">${esc(e.sets)} set · ${esc(e.reps)} reps · RIR ${esc(e.rir||'–')}</div>${prev?`<div class="hint success">Förra gången: ${prev.actual.map(s=>s.kg!==''&&s.reps!==''?`${esc(s.kg)} kg × ${esc(s.reps)}`:'–').join(' / ')}</div>`:'<div class="hint">Ingen tidigare registrering</div>'}<div class="setrow"><span class="muted">Set</span><span class="muted">Kg</span><span class="muted">Reps</span><span class="muted">RIR</span></div>${e.actual.map((s,j)=>`<div class="setrow"><strong>${j+1}</strong><input type="number" min="0" max="1000" step="0.5" inputmode="decimal" aria-label="Vikt set ${j+1}" data-ex="${i}" data-set="${j}" data-key="kg" value="${esc(s.kg)}"><input type="number" min="0" max="100" inputmode="numeric" aria-label="Reps set ${j+1}" data-ex="${i}" data-set="${j}" data-key="reps" value="${esc(s.reps)}"><input type="number" min="0" max="10" step="0.5" inputmode="decimal" aria-label="RIR set ${j+1}" data-ex="${i}" data-set="${j}" data-key="rir" value="${esc(s.rir)}"></div>`).join('')}</div>`}).join('')}<button id="finish">✓ Avsluta och spara pass</button><button class="danger" id="discard">Avbryt pass</button>`;$('finish').onclick=finish;$('discard').onclick=()=>{if(confirm('Avbryta passet utan att spara det i historiken?')){data.active=null;persist();tab('program')}}}function finish(){const a=data.active;if(!a)return;const count=a.exercises.flatMap(e=>e.actual).filter(s=>s.kg!==''&&s.reps!=='').length;if(!count){alert('Registrera minst ett set med vikt och repetitioner.');return}if(!confirm(`Spara passet med ${count} registrerade set?`))return;data.sessions.push({...a,ended:Date.now()});data.active=null;if(persist())tab('history')}document.getElementById('trainContent').addEventListener('input',e=>{const t=e.target;if(!t.dataset.key||!data.active)return;data.active.exercises[+t.dataset.ex].actual[+t.dataset.set][t.dataset.key]=t.value;persist()});document.addEventListener('click',e=>{const b=e.target.closest('[data-start],[data-edit]');if(!b)return;const id=b.dataset.start||b.dataset.edit,p=data.programs.find(x=>x.id===id);if(b.dataset.start)start(id);else if(p)beginEdit(p)});function renderHistory(){let html=[...data.sessions].reverse().map(s=>`<div class="entry"><strong>${esc(s.name)}</strong><div class="muted">${fmt(s.ended||s.time)}</div>${s.exercises.map(e=>`<div style="margin-top:9px"><strong>${esc(e.name)}</strong><div class="muted">${e.actual.filter(x=>x.kg!==''&&x.reps!=='').map(x=>`${esc(x.kg)} kg × ${esc(x.reps)}${x.rir!==''?` · RIR ${esc(x.rir)}`:''}`).join(' / ')||'Inga registrerade set'}</div></div>`).join('')}</div>`).join('');if(data.legacy.length)html+=`<h3>Äldre registreringar</h3>`+data.legacy.map(x=>`<div class="entry"><strong>${esc(x.exercise)}</strong><div class="muted">${esc(x.sets)} × ${esc(x.reps)} @ ${esc(x.weight)} kg · ${esc(x.day)} · ${fmt(x.time)}</div></div>`).join('');$('historyContent').innerHTML=html||'<div class="empty">Dina sparade pass visas här.</div>'}function download(obj){const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='gymlogg-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}$('export').onclick=()=>download(data);$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!Array.isArray(x.programs)||!Array.isArray(x.sessions))throw Error('Fel format');if(!confirm('Ersätta befintlig GymLogg-data med säkerhetskopian?'))return;data={programs:x.programs,sessions:x.sessions,active:x.active||null,legacy:Array.isArray(x.legacy)?x.legacy:[]};persist();tab('program');alert('Backup återställd!')}catch{alert('Kunde inte läsa backup-filen.')}finally{e.target.value=''}};$('wipe').onclick=()=>{if(confirm('Radera alla program och all historik?')&&confirm('Är du helt säker? Exportera gärna en backup först.')){data={programs:[],sessions:[],active:null,legacy:[]};persist();tab('program')}};renderPrograms();
</script></body></html>
